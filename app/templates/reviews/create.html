{% extends "base.html" %}

{% block title %}Review Session - SkillSwap{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding-top: 2.5rem; padding-bottom: 4rem;">
  
  <div style="margin-bottom: 2rem; text-align: center;">
    <h1>Rate & Review Experience</h1>
    <p>Provide honest feedback on your completed session for <strong>{{ exchange.skill_offer.title }}</strong>.</p>
  </div>

  <div class="card" style="padding: 2.5rem;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="text-align: center;">
        <label class="form-label" style="font-size: 1rem; margin-bottom: 0.75rem;">Select Rating (1 to 5 Stars)</label>
        <div style="display: flex; justify-content: center; gap: 1rem;">
          {% for r in [5, 4, 3, 2, 1] %}
            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <input type="radio" name="rating" value="{{ r }}" {% if r == 5 %}checked{% endif %} style="accent-color: #f59e0b; transform: scale(1.3);">
              <span style="font-weight: 700; color: #475569; font-size: 0.9rem;">{{ r }} ★</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div class="form-group" style="margin-top: 1.5rem;">
        <label class="form-label" for="comment">Written Feedback for the {{ target_role }}</label>
        <textarea 
          id="comment" 
          name="comment" 
          class="form-control" 
          rows="4" 
          placeholder="How was the pacing, clarity, and helpfulness? Would you recommend this student to others?" 
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
        Submit Verified Review
      </button>
      <a href="{{ url_for('exchanges.detail', exchange_id=exchange.id) }}" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem; text-align: center;">
        Back to Session
      </a>
    </form>
  </div>

</div>
{% endblock %}
