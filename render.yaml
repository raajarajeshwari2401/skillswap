services:
  - type: web
    name: skillswap-web
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --worker-class eventlet -w 1 wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet

databases:
  - name: skillswap-db
    databaseName: skillswap
    user: skillswap_user
    plan: free
